        <line x1="0" y1="40" x2="300" y2="40" stroke="#D678AA" stroke-opacity="0.5" fill="none" stroke-width="2.5"/>
        <circle cx="24" cy="20" r="5" stroke="#D678AA" stroke-opacity="0.5" fill="none" stroke-width="2.5"/><circle cx="46" cy="20" r="5" stroke="#D678AA" stroke-opacity="0.5" fill="none" stroke-width="2.5"/><circle cx="68" cy="20" r="5" stroke="#D678AA" stroke-opacity="0.5" fill="none" stroke-width="2.5"/>
      </g>

